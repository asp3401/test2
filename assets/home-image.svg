  <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c70f2"/><stop offset="1" stop-color="#5144c8"/></linearGradient>
</defs>
<rect width="900" height="760" rx="40" fill="url(#bg)"/>
