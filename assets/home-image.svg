<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Creative professional at a desk</title>
<desc id="desc">A friendly flat illustration of a person working at a computer, surrounded by abstract shapes and plants.</desc>
<defs>
